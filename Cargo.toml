[package]
name = "mtide"
version = "0.1.0"
edition = "2021"
description = "Rust terminal IDE compatible with TTT"
license = "MIT"

[dependencies]
crossterm = "0.29"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
portable-pty = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
unicode-width = "0.2"

[dev-dependencies]
pretty_assertions = "1"
