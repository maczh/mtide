[workspace]
members = [
    "crates/mtide-api",
    "crates/mtide-proc",
    "crates/mtide-core",
    "crates/mtide-search",
    "crates/mtide-syntax",
    "crates/mtide-tui",
    "crates/mtide-workspace",
    "crates/mtide-vt",
    "crates/mtide-term",
    "crates/mtide-task",
    "crates/mtide-git",
    "crates/mtide-diff",
    "crates/mtide-nav",
    "crates/mtide-ai",
    "crates/mtide-plugin",
    "crates/mtide",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
crossterm = "0.29"
encoding_rs = "0.8"
flate2 = "1"
ropey = "1.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
thiserror = "2"
toml = "0.9"
unicode-segmentation = "1.12"
unicode-width = "0.2"
nix = { version = "0.25", features = ["process", "term"] }
